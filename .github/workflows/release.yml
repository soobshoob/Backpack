# Выпуск по тегу vMAJOR.MINOR.PATCH[-suffix]. Сборка и проверки — без прав записи; публикация — отдельной задачей с правом
# contents: write в окружении `release` (владелец может требовать ручное одобрение в настройках окружения).
# Выпуск создаётся черновиком: владелец просматривает файлы и публикует его сам. Существующие выпуски не перезаписываются.
# Пакет не подписан — это указано в заметках к выпуску.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The first prerelease imports the owner's already-verified ZIP, published manually.
    # Do not rebuild or create a second release for that tag. Future tags use this workflow.
    if: github.ref_name != 'v0.4.0-preview.6'
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Tag must match the project version
        id: version
        shell: pwsh
        run: |
          $props = [xml](Get-Content lab/Directory.Build.props -Raw)
          $prefix = $props.Project.PropertyGroup.VersionPrefix
          $suffix = $props.Project.PropertyGroup.VersionSuffix
          $version = if ($suffix) { "$prefix-$suffix" } else { $prefix }
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag $tag is not vMAJOR.MINOR.PATCH[-suffix]" }
          if ($tag -ne "v$version") { throw "Tag $tag does not match the project version $version (lab/Directory.Build.props)" }
          if (-not (Test-Path "docs/release/RELEASE-NOTES-$version.md")) { throw "docs/release/RELEASE-NOTES-$version.md is missing" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($suffix) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          # Stable — только без суффикса; preview-тег не может стать stable.
          "channel=$(if ($suffix) { 'Preview' } else { 'Stable' })" >> $env:GITHUB_OUTPUT
          # Дата выпуска — дата коммита тега (воспроизводимо), а не часы сборщика.
          "date=$(git log -1 --format=%cs)" >> $env:GITHUB_OUTPUT

      - name: Build package (tests included)
        shell: pwsh
        run: >
          ./tools/package-release.ps1 -ReleaseDate '${{ steps.version.outputs.date }}'
          -Channel '${{ steps.version.outputs.channel }}' -UpdateRepository '${{ github.repository }}'
          -Output "$env:RUNNER_TEMP/release"

      - name: Verify the unpacked package
        shell: pwsh
        run: ./tools/verify-package.ps1 -AllowElevated -Zip "$env:RUNNER_TEMP/release/Backpack-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Collect release files
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/upload"
          $zip = "$env:RUNNER_TEMP/release/Backpack-$v-win-x64.zip"
          Copy-Item $zip $out
          # SHA256SUMS.txt выпуска — только строка этого ZIP (точное имя файла), как ожидает сайт.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Backpack-$v-win-x64.zip" | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii -NoNewline
          Copy-Item "docs/release/RELEASE-NOTES-$v.md" "$out/RELEASE-NOTES.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/upload/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: upload

      - name: Create the release (never overwrite an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: it is not changed. Create a new version instead." >&2
            exit 1
          fi
          {
            cat upload/RELEASE-NOTES.md
            printf '\n\n---\nPortable package for Windows x64: `Backpack-%s-win-x64.zip`. **Not digitally signed**: Windows SmartScreen may warn. Check the SHA-256 in `SHA256SUMS.txt`.\n' "$VERSION"
          } > notes.md
          flags=(--draft --verify-tag --title "Backpack $VERSION" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "upload/Backpack-$VERSION-win-x64.zip" upload/SHA256SUMS.txt "${flags[@]}"
