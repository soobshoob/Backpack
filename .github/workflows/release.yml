# Выпуск по тегу vMAJOR.MINOR.PATCH[-suffix]. Сборка и проверки — без прав записи; публикация — отдельной задачей с правом
# contents: write в окружении `release` (владелец может требовать ручное одобрение в настройках окружения).
# Файлы выпуска: portable-пакет (zip) и установщик Inno Setup (setup.exe), оба из одной проверенной сборки, с контрольными
# суммами. С 0.4.0-preview.8 выпуск публикуется сразу (владелец разрешил публикацию проверенной сборки); переменная
# репозитория RELEASE_AS_DRAFT=true возвращает прежний порядок — черновик, который владелец публикует сам.
# Существующие выпуски не перезаписываются. Пакет и установщик не подписаны — это указано в заметках к выпуску.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The first prerelease imports the owner's already-verified ZIP, published manually.
    # Do not rebuild or create a second release for that tag. Future tags use this workflow.
    if: github.ref_name != 'v0.4.0-preview.6'
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Tag must match the project version
        id: version
        shell: pwsh
        run: |
          $props = [xml](Get-Content lab/Directory.Build.props -Raw)
          $prefix = $props.Project.PropertyGroup.VersionPrefix
          $suffix = $props.Project.PropertyGroup.VersionSuffix
          $version = if ($suffix) { "$prefix-$suffix" } else { $prefix }
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag $tag is not vMAJOR.MINOR.PATCH[-suffix]" }
          if ($tag -ne "v$version") { throw "Tag $tag does not match the project version $version (lab/Directory.Build.props)" }
          if (-not (Test-Path "docs/release/RELEASE-NOTES-$version.md")) { throw "docs/release/RELEASE-NOTES-$version.md is missing" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($suffix) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          # Stable — только без суффикса; preview-тег не может стать stable.
          "channel=$(if ($suffix) { 'Preview' } else { 'Stable' })" >> $env:GITHUB_OUTPUT
          # Дата выпуска — дата коммита тега (воспроизводимо), а не часы сборщика.
          "date=$(git log -1 --format=%cs)" >> $env:GITHUB_OUTPUT

      - name: Build package (tests included)
        shell: pwsh
        run: >
          ./tools/package-release.ps1 -ReleaseDate '${{ steps.version.outputs.date }}'
          -Channel '${{ steps.version.outputs.channel }}' -UpdateRepository '${{ github.repository }}'
          -Output "$env:RUNNER_TEMP/release"

      - name: Verify the unpacked package
        shell: pwsh
        run: ./tools/verify-package.ps1 -AllowElevated -Zip "$env:RUNNER_TEMP/release/Backpack-${{ steps.version.outputs.version }}-win-x64.zip"

      # Установщик — из того же проверенного zip (тот же состав файлов); проверка: тихая установка, состав, тихое удаление.
      - name: Build and verify the Windows installer
        shell: pwsh
        run: >
          ./tools/build-installer.ps1 -InstallInnoSetup -Verify
          -Zip "$env:RUNNER_TEMP/release/Backpack-${{ steps.version.outputs.version }}-win-x64.zip"
          -Output "$env:RUNNER_TEMP/release"

      - name: Installer exists and is not empty
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP/release/Backpack-${{ steps.version.outputs.version }}-win-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
          $len = (Get-Item $setup).Length
          if ($len -le 0) { throw "Empty $setup" }
          Write-Host ("{0}: {1:N0} bytes" -f (Split-Path $setup -Leaf), $len)

      - name: Collect release files
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/upload"
          $zip = "$env:RUNNER_TEMP/release/Backpack-$v-win-x64.zip"
          Copy-Item $zip $out
          Copy-Item "$env:RUNNER_TEMP/release/Backpack-$v-win-x64-setup.exe" $out
          Copy-Item "$env:RUNNER_TEMP/release/Backpack-$v-win-x64-setup.exe.sha256" $out
          # SHA256SUMS.txt выпуска — только строка этого ZIP (точное имя файла), как ожидает сайт.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Backpack-$v-win-x64.zip" | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii -NoNewline
          Copy-Item "docs/release/RELEASE-NOTES-$v.md" "$out/RELEASE-NOTES.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/upload/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: upload

      - name: Create the release (never overwrite an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          AS_DRAFT: ${{ vars.RELEASE_AS_DRAFT }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: it is not changed. Create a new version instead." >&2
            exit 1
          fi
          setup="Backpack-$VERSION-win-x64-setup.exe"
          test -s "upload/$setup" || { echo "Installer missing or empty: $setup" >&2; exit 1; }
          {
            cat upload/RELEASE-NOTES.md
            printf '\n\n---\nWindows x64: installer `%s` (recommended) or portable package `Backpack-%s-win-x64.zip`. **Not digitally signed**: Windows SmartScreen may warn. SHA-256: `SHA256SUMS.txt` (zip) and `%s.sha256` (installer).\n' "$setup" "$VERSION" "$setup"
          } > notes.md
          flags=(--verify-tag --title "Backpack $VERSION" --notes-file notes.md)
          if [ "$AS_DRAFT" = "true" ]; then flags+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "upload/$setup" "upload/$setup.sha256" "upload/Backpack-$VERSION-win-x64.zip" upload/SHA256SUMS.txt "${flags[@]}"

      - name: The installer is attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          size=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"Backpack-$VERSION-win-x64-setup.exe\") | .size")
          test -n "$size" && test "$size" -gt 0 || { echo "Installer asset is missing on release $TAG" >&2; exit 1; }
          echo "Installer asset on $TAG: $size bytes"
